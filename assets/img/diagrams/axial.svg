<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
<title id="t">Axial expansion joint schematic — compression and extension along the pipe axis</title>
<rect width="400" height="260" fill="#F4F5F4"/>
<line x1="30" y1="130" x2="130" y2="130" stroke="#2B3238" stroke-width="10"/>
<line x1="270" y1="130" x2="370" y2="130" stroke="#2B3238" stroke-width="10"/>
<path d="M130,110 L145,150 L160,110 L175,150 L190,110 L205,150 L220,110 L235,150 L250,110 L270,150" fill="none" stroke="#9C6428" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M130,150 L145,110 L160,150 L175,110 L190,150 L205,110 L220,150 L235,110 L250,150 L270,110" fill="none" stroke="#9C6428" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0"/>
<g stroke="#2B5C73" stroke-width="3" fill="none">
<line x1="90" y1="70" x2="140" y2="70" marker-end="url(#arrIn)"/>
<line x1="310" y1="70" x2="260" y2="70" marker-end="url(#arrIn)"/>
</g>
<defs><marker id="arrIn" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2B5C73"/></marker></defs>
<text x="200" y="45" text-anchor="middle" font-family="Bahnschrift,Arial" font-size="15" fill="#2B5C73" letter-spacing="1">AXIAL MOVEMENT</text>
<text x="200" y="210" text-anchor="middle" font-family="Bahnschrift,Arial" font-size="12" fill="#55606A" letter-spacing="1">COMPRESSION / EXTENSION ALONG PIPE AXIS</text>
