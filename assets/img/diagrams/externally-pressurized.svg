<text x="200" y="235" text-anchor="middle" font-family="Bahnschrift,Arial" font-size="12" fill="#55606A" letter-spacing="1">BELLOWS SITS OUTSIDE THE FLOW, IN COMPRESSION NOT TENSION</text>
