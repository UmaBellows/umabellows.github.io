<line x1="30" y1="150" x2="370" y2="150" stroke="#2B3238" stroke-width="14"/>
<path d="M140,110 C155,90 165,90 180,110 C195,130 205,130 220,110 C235,90 245,90 260,110" fill="none" stroke="#9C6428" stroke-width="7" stroke-linecap="round"/>
<path d="M140,190 C155,210 165,210 180,190 C195,170 205,170 220,190 C235,210 245,210 260,190" fill="none" stroke="#9C6428" stroke-width="7" stroke-linecap="round"/>
<g stroke="#2B5C73" stroke-width="3" fill="none">
<line x1="200" y1="90" x2="200" y2="105" marker-end="url(#arrEP)"/>
<line x1="200" y1="210" x2="200" y2="195" marker-end="url(#arrEP)"/>
