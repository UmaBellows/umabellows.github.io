<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
<title id="t">Telescopic expansion joint schematic — nested tube sections slide within one another</title>
<rect width="400" height="260" fill="#F4F5F4"/>
<line x1="30" y1="150" x2="220" y2="150" stroke="#2B3238" stroke-width="18"/>
<line x1="180" y1="150" x2="370" y2="150" stroke="#9C6428" stroke-width="10"/>
<rect x="170" y="130" width="30" height="40" fill="#2B5C73" opacity=".85"/>
<g stroke="#2B5C73" stroke-width="3" fill="none">
<line x1="230" y1="90" x2="270" y2="90" marker-end="url(#arrTe)"/>
<line x1="230" y1="90" x2="230" y2="90"/>
</g>
<defs><marker id="arrTe" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2B5C73"/></marker></defs>
<text x="200" y="45" text-anchor="middle" font-family="Bahnschrift,Arial" font-size="15" fill="#2B5C73" letter-spacing="1">TELESCOPIC SLIP</text>
<text x="200" y="220" text-anchor="middle" font-family="Bahnschrift,Arial" font-size="12" fill="#55606A" letter-spacing="1">ONE TUBE SLIDES INSIDE ANOTHER, SEALED AT THE OVERLAP</text>
</svg>
