<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t">
<title id="t">Vacuum bellows schematic — bellows resists collapse under negative internal pressure</title>
<rect width="400" height="260" fill="#F4F5F4"/>
<line x1="30" y1="150" x2="140" y2="150" stroke="#2B3238" stroke-width="10"/>
<path d="M140,120 L155,160 L170,120 L185,160 L200,120 L215,160 L230,120 L245,160 L260,120" fill="none" stroke="#9C6428" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="260" y1="150" x2="370" y2="150" stroke="#2B3238" stroke-width="10"/>
<g stroke="#2B5C73" stroke-width="3" fill="none">
<line x1="170" y1="95" x2="200" y2="115" marker-end="url(#arrV)"/>
<line x1="230" y1="95" x2="200" y2="115" marker-end="url(#arrV)"/>
</g>
<defs><marker id="arrV" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2B5C73"/></marker></defs>
<text x="200" y="45" text-anchor="middle" font-family="Bahnschrift,Arial" font-size="15" fill="#2B5C73" letter-spacing="1">NEGATIVE PRESSURE (VACUUM)</text>
<text x="200" y="220" text-anchor="middle" font-family="Bahnschrift,Arial" font-size="12" fill="#55606A" letter-spacing="1">HEAVIER-WALL CONVOLUTIONS RESIST INWARD COLLAPSE</text>
</svg>
